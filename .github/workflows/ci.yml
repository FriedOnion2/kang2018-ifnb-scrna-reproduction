name: reproducibility-check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # allow manual runs

jobs:
  env-and-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: repro-kang
          environment-file: envs/environment.yml
          channels: conda-forge,bioconda

      - name: Smoke test — R + Seurat load
        run: |
          Rscript -e 'suppressPackageStartupMessages(library(Seurat)); cat("Seurat", as.character(packageVersion("Seurat")), "on R", R.version.string, "\n")'

      - name: Smoke test — full dependency DLL-check script
        run: |
          Rscript scripts/smoke_test.R

      - name: Verify pipeline scripts are syntactically valid
        run: |
          for f in scripts/01_stim_vs_ctrl.R scripts/02_qc_normalize.R \
                   scripts/03_cluster_umap.R scripts/04_differential.R \
                   scripts/05_render_previews.R; do
            Rscript -e "parse(file='$f'); cat('OK: $f\n')"
          done

      # Full data run is opt-in: download ~73 MB and run the whole pipeline.
      # Off by default to keep CI fast; the user can trigger it manually.
  full-pipeline:
    runs-on: ubuntu-latest
    needs: env-and-smoke
    if: github.event_name == 'workflow_dispatch'   # manual only
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: repro-kang
          environment-file: envs/environment.yml

      - name: Download data and run full pipeline
        run: |
          bash scripts/01_download.sh
          Rscript scripts/01_stim_vs_ctrl.R
          Rscript scripts/02_qc_normalize.R
          Rscript scripts/03_cluster_umap.R
          Rscript scripts/04_differential.R

      - name: Upload figures as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: results-figures
          path: results/figures/*.png